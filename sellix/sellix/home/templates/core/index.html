<!DOCTYPE html>
<html>
<head>
    <title>Sellix</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, black, rgb(1, 203, 1));
        }

        img {
            width: 150px;
            border-radius: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgb(144, 143, 143);
            color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 10px;
            height: 40vh;
            width: 300px;
            box-shadow: 0px 4px 10px rgb(57, 57, 57);
            margin: 30px;
            margin-top: 20px;
        }
        input {
            width: 280px;
            height: 3vh;
            border-radius: 5px;
            border: none;
            margin-top: 10px;
            box-shadow: 0px 4px 10px rgb(57, 57, 57);
        }
        button {
            background: rgb(4, 175, 4);
            width: 270px;
            margin-top: 10px;
            box-shadow: 0px 4px 10px rgb(57, 57, 57);
            border-radius: 5px;
            border: none;
            height: 3vh;
        }
        h1 {
            color: rgb(6, 64, 255);
        }
        button:hover {
            cursor: pointer;
            background: green;
            transition: 1s;
        }
    </style>
</head>
<body>
    <h1>Seja bem vindo a Sellix</h1>
    <div>
        {% load static %}
        <img src="{% static 'logo1.png' %}" alt="logo">
    </div>
    <br>
    <form method="POST">
        {% csrf_token %}
    <div class="container">
        <h1>Login</h1>
        <input type="email" name="gmail" placeholder="Digite seu gmail">
        <input type="password" name="senha" placeholder="Digite sua senha">
    <button>Entrar</button>
    </div>
    </form>

</body>
</html>
